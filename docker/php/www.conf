[www]
user = www-data
group = www-data

listen = 127.0.0.1:9000
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; Process manager — dynamic suits a single-container web tier.
; Tune these via the deployment platform if you change the container CPU/RAM.
;
; Dimensionado para el contenedor de producción (2 CPU / 1024M, ver
; docker-compose.prod.yml). Cada worker PHP ronda ~50-64M RSS, así que 30
; hijos podían superar el cgroup de 1G y provocar OOM/thrashing bajo carga.
; Con los envíos a Meta ya movidos a la cola, los workers web no se bloquean
; en I/O externo, por lo que ~12 hijos rinden mejor que 30 en 2 CPU.
pm = dynamic
pm.max_children = 12
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500
pm.process_idle_timeout = 30s

; Status & ping endpoints used by the healthcheck script via cgi-fcgi
pm.status_path = /fpm-status
ping.path = /fpm-ping
ping.response = pong

; Slow log helps catch runaway requests
request_terminate_timeout = 120s
request_slowlog_timeout = 10s
slowlog = /proc/self/fd/2

; Forward worker stdout/stderr to the container log stream
catch_workers_output = yes
decorate_workers_output = no

clear_env = no
