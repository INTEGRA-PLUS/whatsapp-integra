server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name _;

    root /var/www/html/public;
    index index.php;

    charset utf-8;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "0" always;

    # Lightweight liveness probe — does not hit PHP-FPM
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Hashed Vite assets — long cache
    location ^~ /build/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Block access to dot-files, except .well-known (ACME, etc.)
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Block obvious sensitive paths even if a misconfig drops them under public/
    location ~* /(\.env|composer\.(json|lock)|package(-lock)?\.json|artisan|storage/logs)$ {
        deny all;
    }

    # WebSocket de Reverb (Laravel). El navegador (Echo/pusher-js) se conecta a
    # wss://dominio/app/<key>; aquí se reenvía al contenedor `reverb`.
    # Se usa resolver + variable para que nginx NO resuelva el nombre al arrancar
    # (el contenedor `reverb` levanta después de `app`), sino en cada request.
    location /app {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $reverb_upstream reverb;
        proxy_pass http://$reverb_upstream:8080;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Front controller
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT   $realpath_root;
        fastcgi_param HTTPS           $https if_not_empty;
        fastcgi_hide_header X-Powered-By;
    }
}
