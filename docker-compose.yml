name: whatsapp-integra

# ---------------------------------------------------------------------------
# Base compose stack — production-shaped.
# Use docker-compose.override.yml (auto-loaded) for local-only tweaks,
# or `-f docker-compose.yml -f docker-compose.prod.yml` on the server.
# ---------------------------------------------------------------------------

x-app-env: &app-env
  APP_NAME: ${APP_NAME:-WhatsApp API Manager}
  APP_ENV: ${APP_ENV:-production}
  APP_KEY: ${APP_KEY:?APP_KEY is required}
  APP_DEBUG: ${APP_DEBUG:-false}
  APP_URL: ${APP_URL:?APP_URL is required}
  APP_TIMEZONE: ${APP_TIMEZONE:-America/Bogota}
  APP_LOCALE: ${APP_LOCALE:-es}

  LOG_CHANNEL: ${LOG_CHANNEL:-stack}
  LOG_STACK: ${LOG_STACK:-single}
  LOG_LEVEL: ${LOG_LEVEL:-warning}

  DB_CONNECTION: mysql
  DB_HOST: db
  DB_PORT: 3306
  DB_DATABASE: ${DB_DATABASE:?DB_DATABASE is required}
  DB_USERNAME: ${DB_USERNAME:?DB_USERNAME is required}
  DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}

  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_PASSWORD: ${REDIS_PASSWORD:-null}
  REDIS_CLIENT: phpredis

  CACHE_STORE: ${CACHE_STORE:-redis}
  SESSION_DRIVER: ${SESSION_DRIVER:-redis}
  SESSION_LIFETIME: ${SESSION_LIFETIME:-120}
  QUEUE_CONNECTION: ${QUEUE_CONNECTION:-redis}
  BROADCAST_CONNECTION: ${BROADCAST_CONNECTION:-log}
  FILESYSTEM_DISK: ${FILESYSTEM_DISK:-local}

  ACCESS_TOKEN_META: ${ACCESS_TOKEN_META:-}
  META_WEBHOOK_VERIFY_TOKEN: ${META_WEBHOOK_VERIFY_TOKEN:-}
  META_APP_SECRET: ${META_APP_SECRET:-}
  META_API_VERSION: ${META_API_VERSION:-v21.0}

  MAIL_MAILER: ${MAIL_MAILER:-log}
  MAIL_HOST: ${MAIL_HOST:-127.0.0.1}
  MAIL_PORT: ${MAIL_PORT:-2525}
  MAIL_USERNAME: ${MAIL_USERNAME:-}
  MAIL_PASSWORD: ${MAIL_PASSWORD:-}
  MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-no-reply@example.com}
  MAIL_FROM_NAME: ${MAIL_FROM_NAME:-${APP_NAME:-WhatsApp API Manager}}

x-app-build: &app-build
  build:
    context: .
    dockerfile: Dockerfile
    target: runtime
    args:
      BUILDKIT_INLINE_CACHE: "1"
  image: ${APP_IMAGE:-whatsapp-integra:latest}

x-app-defaults: &app-defaults
  <<: *app-build
  restart: unless-stopped
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  networks: [backend]
  volumes:
    - app_storage:/var/www/html/storage
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  app:
    <<: *app-defaults
    environment:
      <<: *app-env
      RUN_MIGRATIONS: "true"   # only the web container runs migrations
      WARM_CACHES: "true"
    ports:
      - "${APP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck.sh"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  queue:
    <<: *app-defaults
    environment:
      <<: *app-env
      RUN_MIGRATIONS: "false"
      WARM_CACHES: "true"
      SKIP_FPM_PING: "true"
    command:
      - php
      - artisan
      - queue:work
      - --sleep=3
      - --tries=3
      - --max-time=3600
      - --timeout=90
      - --backoff=10
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'queue:work' >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      app:
        condition: service_healthy

  scheduler:
    <<: *app-defaults
    environment:
      <<: *app-env
      RUN_MIGRATIONS: "false"
      WARM_CACHES: "true"
      SKIP_FPM_PING: "true"
    command:
      - php
      - artisan
      - schedule:work
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'schedule:work' >/dev/null"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      app:
        condition: service_healthy

  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:?DB_DATABASE is required}
      MYSQL_USER: ${DB_USERNAME:?DB_USERNAME is required}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}
      TZ: ${APP_TIMEZONE:-America/Bogota}
    command:
      - mysqld
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=caching_sha2_password
      - --innodb-buffer-pool-size=${MYSQL_BUFFER_POOL_SIZE:-256M}
    volumes:
      - db_data:/var/lib/mysql
    networks: [backend]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - "256mb"
      - --maxmemory-policy
      - "allkeys-lru"
    volumes:
      - redis_data:/data
    networks: [backend]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  backend:
    driver: bridge

volumes:
  db_data:
  redis_data:
  app_storage:
