# Production overlay — usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Assumes the image was built and pushed to a registry (CI/CD), so the runtime
# host pulls instead of building. Resource limits, no public DB/Redis ports.

services:
  app:
    pull_policy: always
    build: !reset null
    image: ${APP_IMAGE:?APP_IMAGE must point to a registry tag, e.g. registry.example.com/whatsapp-integra:1.4.2}
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1024M
        reservations:
          cpus: "0.5"
          memory: 256M

  queue:
    pull_policy: always
    build: !reset null
    image: ${APP_IMAGE:?APP_IMAGE must be set}
    deploy:
      replicas: ${QUEUE_REPLICAS:-2}
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  scheduler:
    pull_policy: always
    build: !reset null
    image: ${APP_IMAGE:?APP_IMAGE must be set}
    deploy:
      replicas: 1   # never scale the scheduler
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  db:
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1536M

  redis:
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 320M
